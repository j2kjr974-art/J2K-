name: Build J2K Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack J2K project
        run: unzip -q J2K_Launcher_v0.3.0_Android_Project.zip

      - name: Build debug APK
        working-directory: J2K_Launcher_v2
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J2K-Launcher-debug-APK
          path: J2K_Launcher_v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
